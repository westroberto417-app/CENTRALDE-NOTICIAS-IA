<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="radioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Outer Radio Waves -->
  <path d="M 120 220 A 170 170 0 0 1 392 220" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" opacity="0.4"/>
  <path d="M 160 240 A 120 120 0 0 1 352 240" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" opacity="0.75"/>
  <path d="M 200 260 A 70 70 0 0 1 312 260" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round"/>

  <!-- Radio Microphone / Antenna Body -->
  <circle cx="256" cy="275" r="28" fill="#f59e0b" filter="url(#glow)"/>
  <path d="M 256 303 L 256 400" stroke="#f8fafc" stroke-width="20" stroke-linecap="round"/>
  <path d="M 206 400 L 306 400" stroke="#f8fafc" stroke-width="22" stroke-linecap="round"/>

  <!-- On-Air Live Dot -->
  <circle cx="370" cy="140" r="14" fill="#ef4444"/>
  <text x="395" y="146" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="900" letter-spacing="1.5">EN VIVO</text>

  <!-- Title Badge -->
  <text x="256" y="445" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="2">RADIO CORRIENTES VIVA</text>
  <text x="256" y="475" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="3">CENTRAL DE NOTICIAS IA</text>
</svg>
