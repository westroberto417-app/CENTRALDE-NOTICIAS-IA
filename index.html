<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <script>
      // Safe error listener to prevent sandbox WebSocket disconnection warnings from interrupting execution
      try {
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.includes('WebSocket')) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && String(event.reason).includes('WebSocket')) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      } catch (e) {
        // Safe no-op
      }
    </script>
